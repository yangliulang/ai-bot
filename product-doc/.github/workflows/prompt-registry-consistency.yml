# Registry ↔ routing-engine 对签（与 prompts/library/README.md MR 前自检一致）
# pull_request：不设 paths 过滤 — 任一改动的 MR 均跑，避免漏改 registry/路由仍合并（AC-09q 收口）
name: prompt-registry-consistency

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registry ⊆ routing-engine (FAIL=0)
        run: python3 specs/requirements/prompts/library/scripts/check_registry_vs_routing_engine.py

      - name: governance-map ↔ registry promptPackId (FAIL=0)
        run: python3 specs/requirements/prompts/library/scripts/check_governance_map_vs_registry.py
