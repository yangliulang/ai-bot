openapi: 3.0.3
info:
  title: "Coobit — 子账户合约私有 API"
  version: "2026-05-09"
  description: |
    **独立 futures host**；与 [`design/api.md`](../../design/api.md) **矩阵「合约」** 及 **REST↔WS 对账** 行同窗。
    **CC-P0-02 · B**：**已列** **`paths`** **与** **矩阵** **合约行情/账户/开平仓** **行** **同窗**（**2026-05-12**）。
    同窗 [`exchange-schemas.yaml`](../components/exchange-schemas.yaml)。
  contact:
    name: "Jesson"
    email: Jesson@chainup.com
servers:
  - url: https://futuresapi.example.invalid
    description: 合约网关占位；所内冻结
externalDocs:
  description: 产业锚/扩展阅读
  url: "https://exchangedocsv2.gitbook.io/open-api-doc-v2/futures.md"
tags:
  - name: futures-market
  - name: futures-account
  - name: futures-order
  - name: futures-position
paths:
  "/fapi/v1/ping":
    get:
      tags: [futures-market]
      summary: "连通探活"
      operationId: coobitFuturesGetPing
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "../components/exchange-schemas.yaml#/components/schemas/CoobitJsonValue"
  "/fapi/v1/time":
    get:
      tags: [futures-market]
      summary: "服务器时间"
