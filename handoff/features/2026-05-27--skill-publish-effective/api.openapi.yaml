openapi: 3.0.3
info:
  title: "2026-05-27--skill-publish-effective — Skill Publish + effective read"
  description: |
    Skill 操作规范 Publish 生效链（P‑07 · SK-B1～B3 · SK-B5）。
    - **200/201** 为 FastAPI **直出** camelCase（非 `{ code: 0 }` 信封）。
    - **4xx** 为 **`AppError`**：`code` + `message` + 可选 `details`。
    - 同窗 **`product-doc/specs/openapi/admin/prompt-management.yaml`** · **`skill-operation-spec-schemas.yaml`**。
    - Runtime 读路径 **`GET /api/v1/runtime/skill-operation-spec/effective`** 行为增量见 **`runtime-write-path-pipeline`**（本包改 DB 后端）。
  version: "0.1.0"

servers:
  - url: http://127.0.0.1:8080
    description: 本地 Agent API

paths:
  /api/v1/admin/skill-specs:
    get:
      summary: 技能操作规范列表（AC-2）
      operationId: listSkillOperationSpecs
      tags: [Admin — Skill specs]
      parameters:
        - name: lifecycle
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SkillSpecLifecycle"
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillOperationSpecList"

  /api/v1/admin/skill-specs/{skillId}:
    get:
      summary: 摘要 + 当前生效指针（AC-3）
      operationId: getSkillOperationSpec
      tags: [Admin — Skill specs]
      parameters:
        - $ref: "#/components/parameters/SkillIdPath"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillOperationSpecSummary"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /api/v1/admin/skill-specs/{skillId}/versions:
    get:
      summary: 版本履历（AC-3）
      operationId: getSkillOperationSpecVersions
      tags: [Admin — Skill specs]
      parameters:
        - $ref: "#/components/parameters/SkillIdPath"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSpecVersionHistory"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /api/v1/admin/skill-specs/{skillId}/versions/{skillSpecVersion}:
    get:
      summary: 指定版本正文 Markdown 全文（AC-3）
      operationId: getSkillOperationSpecVersionBody
      tags: [Admin — Skill specs]
      parameters:
        - $ref: "#/components/parameters/SkillIdPath"
        - $ref: "#/components/parameters/SkillSpecVersionPath"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillOperationSpecBody"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /api/v1/admin/skill-specs/{skillId}/publish:
    post:
      summary: 发布技能规范 · 单调 skillSpecVersion（AC-4、AC-9）
      operationId: publishSkillOperationSpec
      tags: [Admin — Skill specs]
      parameters:
        - $ref: "#/components/parameters/SkillIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSpecPublishRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSpecPublishResult"
        "400":
          description: 版本回退或契约未通过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
              examples:
                versionRollback:
                  value:
                    code: PROMPT_SKILL_VERSION_ROLLBACK
                    message: skillSpecVersion 不可低于已发布版本
                contractIncomplete:
                  value:
                    code: PROMPT_SKILL_CONTRACT_INCOMPLETE
                    message: 技能规范未满足 contract-complete 门禁
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /api/v1/internal/skills/effective:
    get:
      summary: Runtime read_skill · 仅 PUBLISHED（AC-5）
      operationId: getInternalEffectiveSkillOperationSpec
      tags: [Internal — Skill specs]
      parameters:
        - name: skillId
          in: query
          required: true
          schema:
            type: string
          example: skill.spot.limit_order
        - name: skillSpecVersion
          in: query
          required: true
          schema:
            type: string
          example: "0.1.0-mvp"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveSkillSpecResponse"
        "304":
          description: ETag 未变
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
              example:
                code: PROMPT_SKILL_REF_INVALID
                message: 技能操作规范未发布或版本无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /api/v1/runtime/skill-operation-spec/effective:
    get:
      summary: Runtime 读生效指针（AC-6 · 存量路由）
      operationId: getRuntimeEffectiveSkillOperationSpec
      tags: [Runtime — Skill operation spec]
      description: |
        已在 **`runtime-write-path-pipeline`** 交付；本包将数据源切换为 DB 生效指针（`skillId` 必填，版本由指针解析）。
      parameters:
        - name: skillId
          in: query
          required: true
          schema:
            type: string
        - name: scenarioId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSkillOperationSpecEffective"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /api/v1/admin/prompt-packs/{promptPackId}/publish:
    post:
      summary: Prompt 发布 · skillSpecRef 门禁增量（AC-7）
      operationId: publishPromptPackWithSkillSpecGate
      tags: [Admin — Prompt packs]
      description: 存量路由；本包增量校验 **TRADING**（及需 ref 的 **ANALYSIS**）**skillSpecRef** 已 PUBLISHED。
      parameters:
        - name: promptPackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 发布成功（存量体）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
              example:
                code: PROMPT_SKILL_REF_INVALID
                message: skillSpecRef 指向的版本未发布

components:
  parameters:
    SkillIdPath:
      name: skillId
      in: path
      required: true
      schema:
        type: string
    SkillSpecVersionPath:
      name: skillSpecVersion
      in: path
      required: true
      schema:
        type: string

  schemas:
    AppError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    SkillSpecLifecycle:
      type: string
      enum: [DRAFT, PUBLISHED, DEPRECATED]

    SkillOperationSpecSummary:
      type: object
      required: [skillId, skillSpecVersion, lifecycle]
      properties:
        skillId:
          type: string
        skillSpecVersion:
          type: string
        lifecycle:
          $ref: "#/components/schemas/SkillSpecLifecycle"
        scenarioIds:
          type: array
          items:
            type: string
        contractComplete:
          type: boolean
        specDigest:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true

    SkillOperationSpecList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkillOperationSpecSummary"

    SkillOperationSpecBody:
      type: object
      required: [skillId, skillSpecVersion, bodyMarkdown]
      properties:
        skillId:
          type: string
        skillSpecVersion:
          type: string
        bodyMarkdown:
          type: string
        specDigest:
          type: string
        sourceGitRef:
          type: string
          nullable: true

    SkillSpecVersionHistory:
      type: object
      properties:
        skillId:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              skillSpecVersion:
                type: string
              lifecycle:
                $ref: "#/components/schemas/SkillSpecLifecycle"
              publishedAt:
                type: string
                format: date-time

    SkillSpecPublishRequest:
      type: object
      required: [skillSpecVersion]
      properties:
        skillSpecVersion:
          type: string
        bodyMarkdown:
          type: string
        specDigest:
          type: string
        sourceGitRef:
          type: string
          nullable: true

    SkillSpecPublishResult:
      type: object
      required: [skillId, skillSpecVersion, lifecycle]
      properties:
        skillId:
          type: string
        skillSpecVersion:
          type: string
        lifecycle:
          $ref: "#/components/schemas/SkillSpecLifecycle"
        specDigest:
          type: string

    EffectiveSkillSpecResponse:
      type: object
      required: [skillId, skillSpecVersion, bodyMarkdown]
      properties:
        skillId:
          type: string
        skillSpecVersion:
          type: string
        bodyMarkdown:
          type: string
        specDigest:
          type: string
        etag:
          type: string

    RuntimeSkillOperationSpecEffective:
      type: object
      description: 与 runtime-write-path-pipeline 一致；sections 为解析节或摘要指针。
      required: [skillId, skillSpecVersion, specDigest, lifecycle]
      properties:
        skillId:
          type: string
        skillSpecVersion:
          type: string
        specDigest:
          type: string
        lifecycle:
          type: string
          example: PUBLISHED
        sections:
          type: array
          items:
            type: object
            additionalProperties: true
